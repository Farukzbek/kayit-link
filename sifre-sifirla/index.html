<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Şifre Sıfırla · Hobby Shelf</title>
<style>
  :root { --bg:#0e0f14; --card:#171923; --text:#f2f3f7; --muted:#a3a8ba; --border:#282c3a; --accent:#d4dcff; --btn-text:#14161f; --danger:#ff7a7a; --ok:#7be0a4; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6fb; --card:#fff; --text:#14161f; --muted:#555a6c; --border:#dfe2ee; --accent:#3d4dc0; --btn-text:#fff; --danger:#c62828; --ok:#1b7f43; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.55; }
  main { max-width:440px; margin:0 auto; padding:40px 20px 64px; }
  h1 { font-size:26px; margin:0 0 6px; }
  p { margin:8px 0; color:var(--muted); font-size:15px; }
  form { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-top:20px; display:grid; gap:12px; }
  input { width:100%; font:inherit; font-size:16px; color:var(--text); background:transparent; border:1px solid var(--border); border-radius:12px; padding:13px 14px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { font:inherit; font-weight:700; font-size:16px; border:0; border-radius:12px; padding:13px; background:var(--accent); color:var(--btn-text); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .link { background:none; color:var(--accent); font-weight:600; font-size:14px; padding:4px; }
  .msg { min-height:20px; font-size:14px; margin:0; }
  .err { color:var(--danger); } .ok { color:var(--ok); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
<h1>Şifreni sıfırla</h1>
<p>Hobby Shelf hesabının e-posta adresini gir; sana 6 haneli bir kod göndereceğiz. Kodu ve yeni şifreni yazarak şifreni değiştirebilirsin.</p>

<form id="f1">
  <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="E-posta adresi" required />
  <button id="b1" type="submit">Kod gönder</button>
  <p class="msg" id="m1"></p>
</form>

<form id="f2" hidden>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="6 haneli kod" required />
  <input id="pw" type="password" autocomplete="new-password" minlength="6" placeholder="Yeni şifre (en az 6 karakter)" required />
  <button id="b2" type="submit">Şifreyi değiştir</button>
  <button class="link" type="button" id="back">Farklı e-posta kullan / yeni kod iste</button>
  <p class="msg" id="m2"></p>
</form>

<p id="done" hidden class="ok"><strong>Şifren değişti.</strong> Uygulamaya dönüp yeni şifrenle giriş yapabilirsin.</p>
<p>Kod 5 dakika geçerlidir. Mail gelmediyse spam (gereksiz) klasörüne bak.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const sb = supabase.createClient('https://szrmabioqkebukbtcfld.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6cm1hYmlvcWtlYnVrYnRjZmxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MDA5NjUsImV4cCI6MjEwNTM3Njk2NX0.JrQIVd3RzNh4epN6c53wkKU5YtiShur4OzUDaKAsjdA',
    { auth: { persistSession: false, autoRefreshToken: false } });
  const $ = (id) => document.getElementById(id);
  const say = (el, text, kind) => { el.textContent = text; el.className = 'msg ' + (kind || ''); };
  const tr = (m) => {
    m = (m || '').toLowerCase();
    if (m.includes('expired') || m.includes('invalid')) return 'Kod hatalı ya da süresi dolmuş. Yeni kod isteyebilirsin.';
    if (m.includes('rate') || m.includes('seconds')) return 'Çok sık denedin, biraz bekleyip tekrar dene.';
    if (m.includes('same') || m.includes('different')) return 'Yeni şifre eskisinden farklı olmalı.';
    if (m.includes('weak') || m.includes('least')) return 'Şifre çok zayıf; en az 6 karakter kullan.';
    return 'Bir sorun oluştu, tekrar dene.';
  };
  let email = '';
  $('f1').addEventListener('submit', async (e) => {
    e.preventDefault();
    email = $('email').value.trim();
    $('b1').disabled = true; say($('m1'), '');
    const { error } = await sb.auth.resetPasswordForEmail(email);
    $('b1').disabled = false;
    if (error) return say($('m1'), tr(error.message), 'err');
    $('f1').hidden = true; $('f2').hidden = false; $('code').focus();
    say($('m2'), 'Bu adrese kayıtlı bir hesap varsa kodu e-postana gönderdik.', '');
  });
  $('back').addEventListener('click', () => { $('f2').hidden = true; $('f1').hidden = false; $('code').value = ''; $('pw').value = ''; say($('m2'), ''); });
  $('f2').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('b2').disabled = true; say($('m2'), '');
    const v = await sb.auth.verifyOtp({ email, token: $('code').value.trim(), type: 'recovery' });
    if (v.error) { $('b2').disabled = false; return say($('m2'), tr(v.error.message), 'err'); }
    const u = await sb.auth.updateUser({ password: $('pw').value });
    await sb.auth.signOut({ scope: 'local' });
    $('b2').disabled = false;
    if (u.error) return say($('m2'), tr(u.error.message) + ' (Kod kullanıldı; yeni kod iste.)', 'err');
    $('f2').hidden = true; $('done').hidden = false;
  });
</script>
</body>
</html>
